name: Security analysis

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  codeql:
    name: CodeQL Java and Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon assembleDebug
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
          upload: false
          output: sarif-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: error

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Requires Dependency graph (and GitHub Advanced Security on private repos) to be enabled
      # in repository settings. It is not, so the action errors out and blocks every PR on a
      # configuration problem rather than a real vulnerability. Kept non-blocking so it starts
      # reporting automatically once the setting is turned on, without silently disappearing.
      #
      # To enable: Settings → Code security and analysis → Dependency graph.
      # Once enabled, drop `continue-on-error` so moderate+ advisories block merges again.
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: moderate
