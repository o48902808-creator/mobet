name: Pin dependency checksums

# Manual bootstrap for dependency verification (gradle/verification-metadata.xml).
#
# Why this exists and why it is manual: the steady-state CI posture is zero-write — every
# regular workflow holds only `contents: read` so a compromised dependency cannot mutate the
# repository. Generating verification metadata requires Gradle to resolve every artifact and
# then write the result back, so it deliberately runs as an admin-triggered, one-off
# maintenance workflow with a write token, and commits reproducibly back to the same branch.
#
# Run it after any dependency or plugin version bump (dependabot PRs included): the metadata
# goes stale on purpose — a changed artifact then *fails* every build until the pins are
# regenerated and reviewed. That fail-closed behavior is the security property: adversary #7
# in docs/THREAT_MODEL.md (a compromised CI dependency) can no longer swap an artifact for a
# payload between releases without breaking the build loudly.
#
# After the workflow commits `gradle/verification-metadata.xml`, every ordinary CI invocation
# (android-ci.yml, security-analysis.yml, release.yml) verifies artifact checksums with no
# further configuration.
on:
  workflow_dispatch:

# This job needs the write token the everyday workflows deliberately refuse. It runs no
# project build logic beyond resolving dependencies, and it pushes exactly one file.
permissions:
  contents: write

jobs:
  pin:
    name: Generate and commit verification-metadata.xml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      # Resolve the same superset of configurations CI exercises so every artifact is pinned:
      # buildscript plugins, unit-test classpath, lint, and the assemble path.
      - name: Resolve dependencies and write checksums
        run: gradle --no-daemon --refresh-dependencies --write-verification-metadata sha256,sha512 lintDebug test assembleDebug

      - name: Commit pins
        run: |
          git config user.name "mobet-pin-bot"
          git config user.email "mobet-pin-bot@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            echo "Pins already current — nothing to commit."
          else
            git commit -m "chore: pin dependency checksums (gradle/verification-metadata.xml)

            Generated by the manual 'Pin dependency checksums' workflow from the dependency
            set at this ref. Future CI runs verify every artifact against these checksums,
            fail-closed. Regenerate after any intentional dependency or plugin bump."
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify the pins hold in a cold resolve
        run: gradle --no-daemon --refresh-dependencies help >/dev/null && echo "verification metadata verified"
