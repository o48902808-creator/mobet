name: Headless Appium smoke

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  appium-smoke:
    name: Appium workflow smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install --global appium@2
          appium driver install uiautomator2

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run workflow through Appium
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          heap-size: 1024M
          emulator-boot-timeout: 900
          script: |
            set -eu
            trap 'test -z "${APPIUM_PID:-}" || kill "$APPIUM_PID" || true' EXIT
            appium --address 127.0.0.1 --port 4723 > /tmp/appium.log 2>&1 &
            APPIUM_PID=$!
            python3 - <<'PY'
            import time
            import urllib.request
            deadline = time.time() + 60
            while time.time() < deadline:
                try:
                    urllib.request.urlopen('http://127.0.0.1:4723/status', timeout=2)
                    break
                except Exception:
                    time.sleep(1)
            else:
                raise SystemExit('Appium did not become ready')
            PY
            python3 scripts/mobet-runner.py \
              app/src/main/assets/sample_workflow.json \
              --server-url http://127.0.0.1:4723 \
              --junit-xml headless-test-results/mobet.xml \
              --captures headless-test-results/captures \
              --approve

      - name: Upload headless report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-appium-report
          path: headless-test-results/
          if-no-files-found: warn

      - name: Report Appium failure
        if: steps.smoke.outcome == 'failure'
        run: |
          if test -f headless-test-results/mobet.xml; then
            sed -n '1,160p' headless-test-results/mobet.xml
          fi
          test ! -f /tmp/appium.log || tail -200 /tmp/appium.log
          exit 1
