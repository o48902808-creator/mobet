name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

# Build jobs receive no repository write token. A compromised dependency cannot mutate source,
# releases, pull requests, or commit comments.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Build & JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The repository intentionally omits the Gradle wrapper JAR; CI pins Gradle itself.
      - name: Run deterministic unit tests
        run: gradle --no-daemon --warning-mode all test

      # Runs before the APK is assembled so a dependency that smuggles in a network
      # permission fails loudly and early rather than shipping. See the task's KDoc in
      # app/build.gradle.kts for why the merged manifest is the thing being checked.
      - name: Verify no network permission in merged manifest
        run: gradle --no-daemon --warning-mode all verifyDebugNoNetworkPermission verifyReleaseNoNetworkPermission

      - name: Run Android security lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon --warning-mode all lintDebug

      - name: Enforce lint findings
        if: steps.lint.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          for issue in root.findall('issue'):
              if issue.get('severity') != 'Error':
                  continue
              location = issue.find('location')
              path = location.get('file', 'app') if location is not None else 'app'
              line = location.get('line', '1') if location is not None else '1'
              message = issue.get('message', issue.get('id', 'Android lint failure'))
              message = message.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print(f'::error file={path},line={line},title=Android lint {issue.get("id")}::{message}')
          PY
          exit 1

      - name: Assemble debug APK
        run: gradle --no-daemon --warning-mode all assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
