name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

# Build jobs receive no repository write token. A compromised dependency cannot mutate source,
# releases, pull requests, or commit comments.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Build & JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test standalone ledger verifier
        run: python3 scripts/test_verify_ledger.py

      # The repository intentionally omits the Gradle wrapper JAR; CI pins Gradle itself.
      - name: Run deterministic unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all test --stacktrace 2>&1 | tee /tmp/gradle-test.log

      # Compiler and Gradle configuration errors never reach the XML reports, so echo them
      # directly as annotations. Without this a build failure is invisible wherever raw job
      # logs cannot be downloaded.
      - name: Report build errors
        if: steps.tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re
          log = open('/tmp/gradle-test.log', errors='replace').read()
          lines = [l for l in log.splitlines()
                   if re.search(r'^e: |error:|FAILURE:|Caused by:|Could not |Unresolved reference|What went wrong', l)]
          for l in lines[:40]:
              msg = l.strip()[:900].replace('%', '%25')
              print(f'::error title=Build error::{msg}')
          if not lines:
              print('::error title=Build error::Gradle failed; see the tail of the log below.')
              for l in log.splitlines()[-40:]:
                  print(l)
          PY

      # Surface failures as GitHub annotations rather than log text only. Job logs are not
      # always retrievable, and an unreadable failure costs a whole debug cycle; annotations are
      # available through the checks API and pinpoint the failing test and message.
      - name: Report failing tests
        if: steps.tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          found = False
          for path in glob.glob('app/build/test-results/**/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      found = True
                      name = f"{case.get('classname')}.{case.get('name')}"
                      text = (bad.get('message') or bad.text or 'test failed')[:900]
                      text = text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                      print(f'::error title=Test failed {name}::{text}')
          if not found:
              print('::error title=Build failure::Tests task failed without producing a test report; this is usually a compilation or Gradle configuration error.')
          PY
          exit 1

      # Runs before the APK is assembled so a dependency that smuggles in a network
      # permission fails loudly and early rather than shipping. See the task's KDoc in
      # app/build.gradle.kts for why the merged manifest is the thing being checked.
      - name: Verify no network permission in merged manifest
        id: netcheck
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all \
            verifyDebugNoNetworkPermission verifyReleaseNoNetworkPermission 2>&1 \
            | tee /tmp/netcheck.log

      - name: Report network-permission findings
        if: steps.netcheck.outcome == 'failure'
        run: |
          python3 - <<'PY'
          log = open('/tmp/netcheck.log', errors='replace').read()
          start = log.find('* What went wrong:')
          excerpt = log[start:start + 2000] if start != -1 else log[-2000:]
          for line in excerpt.splitlines():
              s = line.strip()
              if s:
                  print(f'::error title=Network permission check::{s[:900].replace("%", "%25")}')
          PY
          exit 1

      - name: Run Android security lint
        id: lint
        continue-on-error: true
        run: gradle --no-daemon --warning-mode all lintDebug

      - name: Enforce lint findings
        if: steps.lint.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          for issue in root.findall('issue'):
              if issue.get('severity') != 'Error':
                  continue
              location = issue.find('location')
              path = location.get('file', 'app') if location is not None else 'app'
              line = location.get('line', '1') if location is not None else '1'
              message = issue.get('message', issue.get('id', 'Android lint failure'))
              message = message.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print(f'::error file={path},line={line},title=Android lint {issue.get("id")}::{message}')
          PY
          exit 1

      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --warning-mode all assembleDebug --stacktrace 2>&1 | tee /tmp/assemble.log

      - name: Report APK assembly errors
        if: steps.assemble.outcome == 'failure'
        run: |
          python3 - <<'PY'
          log = open('/tmp/assemble.log', errors='replace').read()
          markers = ('* What went wrong:', 'Execution failed for task', 'Caused by:', 'More than one file', 'Duplicate class')
          lines = [line.strip() for line in log.splitlines() if any(m in line for m in markers)]
          for line in lines[-30:]:
              safe = line[:900].replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
              print(f'::error title=APK assembly::{safe}')
          PY
          exit 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  connected-tests:
    name: Connected device tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 29 boots fast on the runner and still exercises a real AndroidKeyStore (GMS or not),
      # which is the only thing these tests need. No named profile — the default phone AVD is
      # the boot-reliable one on this action.
      - name: Run instrumented tests (API 29)
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 29
          arch: x86_64
          heap-size: 1024M
          emulator-boot-timeout: 900
          script: gradle --no-daemon connectedDebugAndroidTest --stacktrace 2>&1 | tee /tmp/connected.log

      # Job logs are not always retrievable, so failures must surface as annotations the same
      # way the JVM job already does them: per-test results from the connected-test XML, and a
      # build-error excerpt when compilation (androidTest sourceset) is what failed.
      - name: Report device test failures
        if: steps.device.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          found = False
          for path in glob.glob('app/build/outputs/androidTest-results/connected/*.xml') + \
                        glob.glob('app/build/outputs/androidTest-results/**/*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      found = True
                      name = f"{case.get('classname')}.{case.get('name')}"
                      text = (bad.get('message') or bad.text or 'test failed')[:900]
                      text = text.replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D')
                      print(f'::error title=Device test failed {name}::{text}')
          if not found:
              try:
                  log = open('/tmp/connected.log', errors='replace').read()
              except OSError:
                  log = ''
              lines = [l for l in log.splitlines()
                       if re.search(r'^e: |error:|FAILURE:|Caused by:|Could not |Unresolved reference|What went wrong', l)]
              if lines:
                  for l in lines[:40]:
                      print(f'::error title=Device build error::{l.strip()[:900].replace("%", "%25")}')
              else:
                  print('::error title=Device failure::connectedDebugAndroidTest failed; no XML or error lines found.')
          raise SystemExit(1)
          PY
