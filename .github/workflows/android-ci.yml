name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:

# Build jobs receive no repository write token. A compromised dependency cannot mutate source,
# releases, pull requests, or commit comments.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Build & JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The repository intentionally omits the Gradle wrapper JAR; CI pins Gradle itself.
      - name: Run unit tests and Android security lint
        run: gradle --no-daemon --warning-mode all test lintDebug 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug APK
        run: gradle --no-daemon --warning-mode all assembleDebug 2>&1 | tee -a build-output.log; exit ${PIPESTATUS[0]}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
