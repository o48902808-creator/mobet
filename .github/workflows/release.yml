name: Release APK

# Manual dispatch (optionally also fires on v* tag pushes) builds the APK and
# publishes it as a GitHub Release asset named mobet.apk, so the stable URL
# https://github.com/o48902808-creator/mobet/releases/latest/download/mobet.apk
# always points at the newest release's APK.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.6.0)"
        required: true
      title:
        description: "Release title (defaults to the tag)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

# Zero-write CI posture, same as android-ci.yml: the build job receives no
# repository write token, so a compromised dependency cannot mutate releases.
# Only the publish job may write, and it executes no project code — it just
# turns the already-built artifact into a release.
permissions:
  contents: read

jobs:
  build:
    name: Build mobet.apk
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Generate the payload before compilation so the app can verify and display it offline.
      # The workflow still adds the final whole-APK digest to the external sidecar after build:
      # embedding that value in the APK itself would change the digest recursively.
      - name: Generate embedded capability manifest
        env:
          ATTESTATION_REF: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifact-attestation
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          python3 scripts/generate-capability-manifest.py \
            --output app/src/main/assets/mobet-capability.json \
            --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --commit "$GITHUB_SHA" --workflow "$GITHUB_WORKFLOW_REF" \
            --attestation "$ATTESTATION_REF" --build-type debug --signing debug

      # The repository intentionally omits the Gradle wrapper JAR; CI pins Gradle itself.
      - name: Run deterministic unit tests
        run: gradle --no-daemon --warning-mode all test assembleDebug

      - name: Stage as mobet.apk
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk mobet.apk
          test -s mobet.apk
          sha256sum mobet.apk | tee mobet.apk.sha256
          cp app/src/main/assets/mobet-capability.json mobet-capability.json
          python3 - <<'PYTHON'
          import hashlib, json
          path = "mobet-capability.json"
          manifest = json.load(open(path))
          digest = hashlib.sha256(open("mobet.apk", "rb").read()).hexdigest()
          manifest["artifact"] = "mobet.apk"
          manifest["sha256"] = digest
          json.dump(manifest, open(path, "w"), indent=2)
          open(path, "a").write("\n")
          PYTHON

      - name: Generate privacy-preserving evidence bundle
        run: |
          python3 scripts/build-evidence-bundle.py \
            --apk mobet.apk --capability mobet-capability.json \
            --tests app/build/test-results --output mobet-evidence.zip
          sha256sum mobet-evidence.zip > mobet-evidence.zip.sha256

      - name: Rebuild independently and report reproducibility
        run: |
          gradle --no-daemon clean assembleDebug
          SECOND=app/build/outputs/apk/debug/app-debug.apk
          FIRST_SHA="$(sha256sum mobet.apk | awk '{print $1}')"
          SECOND_SHA="$(sha256sum "$SECOND" | awk '{print $1}')"
          STATUS=non-reproducible
          test "$FIRST_SHA" != "$SECOND_SHA" || STATUS=reproducible
          python3 - "$FIRST_SHA" "$SECOND_SHA" "$STATUS" <<'PYTHON'
          import json, sys
          json.dump({"schema":"mobet.reproducibility.v1","firstSha256":sys.argv[1],
                     "secondSha256":sys.argv[2],"status":sys.argv[3]}, open("mobet-reproducibility.json","w"), indent=2)
          open("mobet-reproducibility.json","a").write("\n")
          PYTHON
          cat mobet-reproducibility.json

      - name: Generate SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: mobet.apk

      - name: Stage offline Sigstore bundle
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" mobet.sigstore.json
          test -s mobet.sigstore.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobet-apk
          path: |
            mobet.apk
            mobet.apk.sha256
            mobet-capability.json
            mobet-evidence.zip
            mobet-evidence.zip.sha256
            mobet-reproducibility.json
            mobet.sigstore.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: mobet-apk

      - name: Publish release with mobet.apk asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.title || '' }}
        run: |
          set -euo pipefail
          sha256sum -c mobet.apk.sha256
          SHA="$(awk '{print $1}' mobet.apk.sha256)"
          SIZE="$(numfmt --to=iec --suffix=B "$(stat -c%s mobet.apk)")"
          TITLE="${TITLE:-$TAG}"
          RUN_URL="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"

          cat > release-notes.md <<EOF
          ## Mobet ${TAG}

          Direct download (always the latest release):

          \`https://github.com/${REPO}/releases/latest/download/mobet.apk\`

          - Built from commit [\`${COMMIT:0:10}\`](${GITHUB_SERVER_URL}/${REPO}/commit/${COMMIT}) (debug build, signed with the debug key)
          - Asset: \`mobet.apk\` — ${SIZE}
          - SHA-256: \`${SHA}\`
          - Build log: ${RUN_URL}
          EOF

          gh release create "$TAG" mobet.apk mobet.apk.sha256 mobet-capability.json \
            mobet-evidence.zip mobet-evidence.zip.sha256 mobet-reproducibility.json mobet.sigstore.json \
            --repo "$REPO" \
            --target "$COMMIT" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --latest
